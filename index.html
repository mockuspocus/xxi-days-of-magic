<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>XXI days of magic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap">
<style>
  :root {
    --ink: #3E2236;
    --line: #8C6A80;
    --card: rgba(250, 245, 247, 0.62);
    --card-strong: rgba(255, 255, 255, 0.88);
    --border: #B89AAE;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: #F2D4DC;
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    -webkit-text-size-adjust: 100%;
  }
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .bg .clouds { opacity: 0.35; object-position: center 30%; }
  .bg .sketch { opacity: 0.4; mix-blend-mode: multiply; }
  .bg .veil { position: absolute; inset: 0; background: #FAF5F7; opacity: 0.6; }

  main {
    position: relative; z-index: 1; overflow-x: hidden;
    max-width: 560px; margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 16px 40px;
  }
  header { position: relative; padding: 8px 0 20px; }
  .kicker { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; line-height: 1.6; }
  h1 {
    margin: 8px 0 0; font-family: 'Italiana', serif; font-weight: 400;
    font-size: clamp(36px, 11vw, 54px); line-height: 1; letter-spacing: 0.04em; text-transform: uppercase;
  }
  .sub { margin: 10px 0 0; font-style: italic; font-weight: 500; font-size: 19px; line-height: 1.25; }
  .star { position: absolute; filter: drop-shadow(0 0 4px rgba(255,255,255,.95)); }

  ol.days { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .day {
    display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 12px; align-items: start;
    padding: 10px 12px 8px; border: 1px solid transparent; border-radius: 6px;
    transition: background .25s, border-color .25s;
  }
  .day.filled { background: var(--card); border-color: var(--border); }
  .day.today { background: var(--card-strong); border-color: var(--ink); box-shadow: 0 0 18px rgba(255,255,255,.7); }
  .date { text-align: right; padding-top: 2px; }
  .num { display: block; font-size: 26px; font-weight: 600; line-height: 1; }
  .wd { display: block; margin-top: 3px; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; }
  .today-tag { display: none; margin-bottom: 2px; font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; }
  .day.today .today-tag { display: block; }
  textarea {
    display: block; width: 100%; min-height: 34px; padding: 4px 0 6px; resize: none;
    border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent;
    color: var(--ink); font-family: inherit; font-style: italic; font-weight: 500; font-size: 18px; line-height: 1.3;
    outline: none; field-sizing: content;
  }
  textarea::placeholder { color: var(--line); opacity: 1; }
  .fixed { margin: 0; padding: 4px 0 6px; font-style: italic; font-weight: 600; font-size: 18px; line-height: 1.3; }
  textarea:focus { border-bottom-color: var(--ink); }

</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <img src="img/ground.jpg" alt="">
  <img class="clouds" src="img/clouds.jpg" alt="">
  <img class="sketch" src="img/sketch.jpg" alt="">
  <div class="veil"></div>
</div>

<main>
  <header>
    <svg class="star" style="right: 6px; top: 4px" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 0 L13 9 L22 11 L13 13 L11 22 L9 13 L0 11 L9 9 Z" fill="#fff"/></svg>
    <svg class="star" style="right: 30px; top: 58px" width="36" height="36" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 0 L13 9 L22 11 L13 13 L11 22 L9 13 L0 11 L9 9 Z" fill="#fff"/></svg>
    <p class="kicker">after the day of Nastassja · november</p>
    <h1>XXI days<br>of magic</h1>
    <p class="sub">catch the main magic of every day — and write it down</p>
  </header>

  <ol class="days" id="days"></ol>

</main>

<script>
  const KEY = 'xxi-days-of-magic-v1';
  const YEAR = 2026, MONTH = 10; // November (0-based)
  const WD = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];

  let notes = {};
  try { notes = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { notes = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) {} };

  const now = new Date();
  const todayNum = now.getFullYear() === YEAR && now.getMonth() === MONTH ? now.getDate() : null;

  const list = document.getElementById('days');
  for (let d = 10; d <= 30; d++) {
    const li = document.createElement('li');
    li.className = 'day';
    li.dataset.day = d;
    const wd = WD[new Date(YEAR, MONTH, d).getDay()];
    li.innerHTML =
      '<div class="date"><span class="num">' + d + '</span><span class="wd">' + wd + '</span></div>' +
      '<div><span class="today-tag">today ✦</span></div>';
    if (d === 10) {
      // the birthday itself: already filled in, nothing to write
      const p = document.createElement('p');
      p.className = 'fixed';
      p.textContent = 'the day of Nastassja ✦';
      li.lastChild.appendChild(p);
    } else {
      const ta = document.createElement('textarea');
      ta.rows = 1;
      ta.placeholder = 'the main magic of the day';
      ta.setAttribute('aria-label', 'November ' + d + ', the main magic of the day');
      ta.value = notes[d] || '';
      ta.addEventListener('input', () => { notes[d] = ta.value; save(); update(); });
      li.lastChild.appendChild(ta);
    }
    if (d === todayNum) li.classList.add('today');
    list.appendChild(li);
  }

  function update() {
    list.querySelectorAll('.day').forEach(li => {
      const filled = !!(notes[li.dataset.day] || '').trim();
      li.classList.toggle('filled', filled);
    });
  }
  update();

  const todayEl = list.querySelector('.today');
  if (todayEl && todayNum > 12) todayEl.scrollIntoView({ block: 'center' });

</script>
</body>
</html>
